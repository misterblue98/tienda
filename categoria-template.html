<!DOCTYPE html>

  <!--
    ══════════════════════════════════════════════════════
    PLANTILLA PARA NUEVA CATEGORÍA — Shopteria
    ══════════════════════════════════════════════════════
    Pasos para usarla:
    1. Guarda este archivo con el nombre de tu categoría
       Ej: figuras.html  /  funko.html  /  manga.html
    2. Cambia el <title> y el h1 .site-title
    3. Crea un archivo  js/NOMBRE.js  con tus productos
       (copia pokemon.js como base y adapta los datos)
    4. Crea un archivo  css/NOMBRE.css  si necesitas estilos
       específicos (o reutiliza pokemon.css)
    5. Agrega la tarjeta de la categoría en index.html
    ══════════════════════════════════════════════════════
  -->
  <title>Shopteria · Nueva Categoría</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/pokemon.css"/><!-- cambia por tu css si creas uno propio -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="back-link" href="index.html">Inicio</a>
  <div class="corner-accent tl"></div>
  <div class="corner-accent tr"></div>
  <div class="corner-accent bl"></div>
  <div class="corner-accent br"></div>
  <div class="header-inner">
    <div class="logo-icon">✨</div><!-- cambia el emoji -->
    <h1 class="site-title">Mi Categoría</h1><!-- cambia el nombre -->
    <p class="site-sub">
      <span>●</span> Productos Originales
      <span>●</span> Envío a todo Chile
      <span>●</span> Pago Seguro
    </p>
  </div>

<!--
  ── FILTROS (opcional) ──────────────────────────────
  Si tus productos tienen tipos/categorías internas,
  puedes mantener esta barra de filtros.
  Si no los necesitas, borra todo el <nav>.
-->
<nav class="nav-strip" id="tabsNav">
  <button class="tab active" data-filter="all">Todos</button>
  <!-- Agrega más tabs según tus subcategorías -->
  <!-- <button class="tab" data-filter="tipo1">🔥 Tipo 1</button> -->
</nav>

<!--
  ── SECCIÓN DESTACADA (opcional) ───────────────────
  Úsala para productos destacados, novedades, etc.
  Si no la necesitas, borra este bloque.
-->
<section class="hero-banner z">
  <h2>— Destacados</h2>
  <div class="packs-row" id="packsRow"></div>
</section>

<!-- GRILLA DE PRODUCTOS -->
<div class="section-title z">— Productos</div>
<main class="shop-grid z" id="shopGrid"></main>

<!-- MODAL (no tocar) -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true"
     aria-labelledby="modalName" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalDirect()" aria-label="Cerrar">✕</button>
    <div class="modal-emoji-wrap" id="modalEmoji"></div>
    <h2 class="modal-title" id="modalName"></h2>
    <div class="modal-type" id="modalType"></div>
    <div class="modal-price-tag" id="modalPrice"></div>
    <p class="modal-desc" id="modalDesc"></p>
    <div id="wallet_container"></div>
  </div>
</div>
